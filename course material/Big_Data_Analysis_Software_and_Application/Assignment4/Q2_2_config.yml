version: "3.9"

services:
  civil-mirror-backend:
    image: python:3.11-slim
    container_name: civil_mirror_backend
    working_dir: /app
    volumes:
      - ./backend:/app
    command: >
      sh -c "pip install -r requirements.txt &&
             uvicorn main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8002:8000"
    environment:
      - DATABASE_URL=postgresql://civil_user:civil_password@civil-mirror-postgres:5432/civil_mirror_db
      - REDIS_URL=redis://civil-mirror-redis:6379/0
      - LLM_API_URL=http://civil-mirror-llm-gateway:9000/generate
      - REPORT_RETENTION_DAYS=30
    depends_on:
      - civil-mirror-postgres
      - civil-mirror-redis
      - civil-mirror-llm-gateway

  civil-mirror-frontend:
    image: node:20-alpine
    container_name: civil_mirror_frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
    command: >
      sh -c "npm install &&
             npm run dev -- --host 0.0.0.0"
    ports:
      - "3002:3000"
    depends_on:
      - civil-mirror-backend

  civil-mirror-llm-gateway:
    image: python:3.11-slim
    container_name: civil_mirror_llm_gateway
    working_dir: /app
    volumes:
      - ./llm_gateway:/app
    command: >
      sh -c "pip install -r requirements.txt &&
             uvicorn main:app --host 0.0.0.0 --port 9000"
    environment:
      - LLM_PROVIDER=openai_or_local_model
      - LLM_API_KEY=${LLM_API_KEY}
      - DEFAULT_MODEL=gpt-or-local-model
    ports:
      - "9002:9000"

  civil-mirror-postgres:
    image: postgres:15
    container_name: civil_mirror_postgres
    environment:
      - POSTGRES_USER=civil_user
      - POSTGRES_PASSWORD=civil_password
      - POSTGRES_DB=civil_mirror_db
    volumes:
      - civil_mirror_postgres_data:/var/lib/postgresql/data
    ports:
      - "5434:5432"

  civil-mirror-redis:
    image: redis:7-alpine
    container_name: civil_mirror_redis
    ports:
      - "6381:6379"

volumes:
  civil_mirror_postgres_data: